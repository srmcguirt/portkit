[package]
name = "portkit-schema"
description = "Schema grounding for portkit: introspect a source of truth, materialize a fingerprinted snapshot, and check agent-supplied names against it before dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
portkit-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
time.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
moka = { version = "0.12", features = ["future"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "pks"
path = "src/main.rs"
